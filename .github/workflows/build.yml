name: Build (reusable)

# Reusable workflow that builds the sdist and one wheel per supported
# architecture (x86_64, aarch64) and uploads them as artifacts:
#   sdist                        -> dist/*.tar.gz
#   wheel-manylinux_2_34_x86_64  -> dist/*.whl
#   wheel-manylinux_2_34_aarch64 -> dist/*.whl
# ci.yml consumes these via actions/download-artifact.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0  # hatch-vcs takes the version from the tags
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
          version: "0.11.26"
          python-version: "3.13"
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  wheel:
    name: Build wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: manylinux_2_34_x86_64
          - runner: ubuntu-24.04-arm
            platform: manylinux_2_34_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0  # hatch-vcs takes the version from the tags
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
          version: "0.11.26"
          python-version: "3.13"
      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
      - name: Build wheel
        run: uv build --wheel
      - run: ls -l dist/
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
