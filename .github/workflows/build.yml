name: Build
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  #-----------------------------------------------------------------------------

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # keep aligned with [tool.ruff] in pyproject.toml
      - name: Check formatting
        run: uvx --from 'ruff~=0.16.0' ruff format --check .

      - name: Lint
        run: uvx --from 'ruff~=0.16.0' ruff check .

      # reuse from the dev group, at the version in uv.lock
      - name: Check REUSE compliance
        run: uv run --locked reuse lint

  #-----------------------------------------------------------------------------

  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the sdist comes from this leg only, and its wheel is built from it
          - runner: ubuntu-24.04
            platform: manylinux_2_34_x86_64
            build: uv build --no-sources
          - runner: ubuntu-24.04-arm
            platform: manylinux_2_34_aarch64
            build: uv build --no-sources --wheel
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    steps:
      # full history for hatch-vcs
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # the wheel carries the BPF object compiled here
      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Build project
        run: ${{ matrix.build }}

      - name: Smoke-test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'EOF'
          import os
          from importlib import resources
          from tracct.version import __version__
          print(__version__)
          package = resources.files("tracct")
          assert (package / "bpf" / "tracct.bpf.o").is_file()
          assert (package / "files" / "tracct.service").is_file()
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              assert __version__ == expected, (__version__, expected)
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/

  #-----------------------------------------------------------------------------

  Test:
    needs:
      - Build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        platform:
          - runner: ubuntu-24.04
            name: manylinux_2_34_x86_64
          - runner: ubuntu-24.04-arm
            name: manylinux_2_34_aarch64
    name: Test (${{ matrix.platform.name }}, ${{ matrix.python }})
    runs-on: ${{ matrix.platform.runner }}
    steps:
      # only the tests; tracct comes from the wheel the Build job made
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tests
            pyproject.toml
          sparse-checkout-cone-mode: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.platform.name }}
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}

      # libbpf1 provides libbpf.so for the ctypes wrapper; the tests run curl and wget
      # as short-lived processes
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf1 curl wget

      # the versions in uv.lock
      - name: Install wheel and test dependencies
        run: |
          uv venv
          uv pip install "$(ls dist/*.whl)[viewer]" textual==8.2.8 pytest==9.1.1 pytest-asyncio==1.4.1

      # as root: the functional tests load the BPF program
      - name: Run tests
        run: sudo -E env "PATH=$PATH" .venv/bin/pytest tests/ -v

  #-----------------------------------------------------------------------------

  Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - Lint
      - Build
      - Test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --generate-notes

  #-----------------------------------------------------------------------------

  PyPI:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs:
      - Build
      - Release
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/tracct
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
