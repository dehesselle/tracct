name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, reuse)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          version: "0.11.26"
      # keep aligned with [tool.ruff] in pyproject.toml
      - run: uvx --from 'ruff~=0.16.0' ruff check
      - run: uvx --from 'ruff~=0.16.0' ruff format --diff
      # reuse runs from the dev group, at the version in uv.lock
      - run: uv sync --locked
      - run: uv run reuse lint

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  test:
    name: Tests (${{ matrix.platform.name }}, py${{ matrix.python-version }}, requires root/BPF)
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        platform:
          - runner: ubuntu-24.04
            name: manylinux_2_34_x86_64
          - runner: ubuntu-24.04-arm
            name: manylinux_2_34_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Only need the tests/ directory; install tracct from the wheel
          # that the build job produced rather than from the working tree.
          sparse-checkout: |
            tests
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          version: "0.11.26"
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        # libbpf1 provides libbpf.so for tracct's ctypes wrapper.
        # curl/wget are exercised by the tests as short-lived processes.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf1 curl wget
      - name: Install tracct wheel (with the viewer) + pytest into venv
        # the versions in uv.lock
        run: |
          uv venv
          uv pip install "$(ls dist/*.whl)[viewer]" textual==8.2.8 pytest==9.1.1 pytest-asyncio==1.4.1
      - name: Run tests
        run: sudo -E env "PATH=$PATH" .venv/bin/pytest tests/ -v
