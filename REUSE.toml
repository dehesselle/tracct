version = 1

# Files that can't carry an SPDX comment, or shouldn't: the docs stay clean when rendered.
[[annotations]]
path = ["README.md", "CLAUDE.md", "docs/*.md"]
SPDX-FileCopyrightText = "2026 René de Hesselle <dehesselle@web.de>"
SPDX-License-Identifier = "0BSD"

# generated by bench/lib/report.py; the results are upstream's
[[annotations]]
path = "bench/reports/**"
SPDX-FileCopyrightText = "2026 Eric Lesiuta"
SPDX-License-Identifier = "GPL-3.0-or-later"

# kernel type definitions dumped from BTF by bpftool, taken from libbpf/vmlinux.h, which
# states no license; they are the kernel's
[[annotations]]
path = "src/tracct/bpf/vmlinux_*.h"
SPDX-FileCopyrightText = "Linux kernel contributors"
SPDX-License-Identifier = "GPL-2.0-only"
