[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tracct"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Monitor network traffic per executable using BPF"
readme = "README.md"
# the whole is GPL-3.0-or-later; the BPF program is GPL-2.0-only and new files are 0BSD
license = "GPL-3.0-or-later AND GPL-2.0-only AND 0BSD"
license-files = ["LICENSES/*"]
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
# the viewer, `tracct view`; the daemon and the query server need only the standard library
tui = ["textual>=8.2.8,<9", "tcoda>=0.8,<0.9"]

[project.scripts]
tracct = "tracct.cli:start_tracct"

[project.urls]
Homepage = "https://github.com/dehesselle/picosnitch"
Repository = "https://github.com/dehesselle/picosnitch"

[tool.hatch.version]
source = "vcs"
# only tracct's own release tags; picosnitch's are kept as picosnitch-<version>
raw-options = { scm = { git = { describe_command = "git describe --dirty --tags --long --match v[0-9]*" } } }

[tool.hatch.build.hooks.vcs]
version-file = "src/tracct/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src/tracct/",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/LICENSES/",
    "/REUSE.toml",
    "/systemd/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracct"]
exclude = ["src/tracct/bpf/vmlinux*.h"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py312"
line-length = 200
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "reuse==6.2.0",
    "ruff==0.15.20",
    "tcoda==0.8.0",
    "textual==8.2.8",
]
