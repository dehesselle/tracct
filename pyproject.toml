[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picosnitch"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Monitor network traffic per executable using BPF"
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Monitoring",
]

[project.scripts]
picosnitch = "picosnitch.cli:start_picosnitch"

[project.urls]
Homepage = "https://github.com/dehesselle/picosnitch"
Repository = "https://github.com/dehesselle/picosnitch"

[tool.hatch.version]
path = "src/picosnitch/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src/picosnitch/",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/systemd/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/picosnitch"]
exclude = ["src/picosnitch/bpf/vmlinux*.h"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py312"
line-length = 200
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
    "tach==0.35.0",
    "ty==0.0.55",
]
