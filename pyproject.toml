[project]
name = "tracct"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Monitor network traffic per executable using BPF"
readme = "README.md"
# the whole is GPL-3.0-or-later; the BPF program is GPL-2.0-only and new files are 0BSD
license = "GPL-3.0-or-later AND GPL-2.0-only AND 0BSD"
license-files = ["LICENSES/*"]
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
# the viewer, `tracct view`; the daemon and the query server need only the standard library
tui = ["textual>=8.2.8,<9", "tcoda>=0.9,<0.10"]

[project.scripts]
tracct = "tracct.cli:start_tracct"

[project.urls]
Homepage = "https://github.com/dehesselle/picosnitch"
Repository = "https://github.com/dehesselle/picosnitch"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.vcs]
version-file = "src/tracct/version.py"

[tool.hatch.version]
source = "vcs"
# only tracct's own release tags; picosnitch's are kept as picosnitch-<version>
raw-options = { scm = { git = { describe_command = "git describe --dirty --tags --long --match v[0-9]*" } } }

[tool.hatch.build.targets.sdist]
include = [
    "/src/tracct/",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/LICENSES/",
    "/REUSE.toml",
    "/systemd/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracct"]
exclude = ["src/tracct/bpf/vmlinux*.h"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The viewer tests are all async; auto mode saves marking every one of them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reuse>=6.2.0",
    # the bounds of the tui extra, so the tests run against what users get
    "tcoda>=0.9.0,<0.10",
    "textual>=8.2.8,<9",
    "textual-dev>=1.8.0",
]

[tool.ruff]
# Ruff comes from outside the project, and its defaults change between minor
# releases; bump this once a new minor's findings have been reviewed, together
# with the pin in .github/workflows/ci.yml.
required-version = "~=0.16.0"
target-version = "py312"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# ruff's default rules plus import sorting
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# kept close to picosnitch's, so its fixes can be carried over (see docs/DESIGN.md)
"src/tracct/bpf_wrapper.py" = ["BLE001", "S110"]
# ruff 0.16's wider defaults, not yet taken on in these parts
"src/tracct/*.py" = ["BLE001", "S110", "S112"]
"tests/*.py" = ["PLR0402", "PLW1510", "RUF059", "RUF100"]
"bench/**/*.py" = [
    "BLE001",
    "FURB192",
    "ISC004",
    "PLW1510",
    "RUF012",
    "S110",
    "S112",
    "SIM102",
    "SIM115",
    "UP041",
]

[tool.ruff.format]
# kept close to picosnitch's, so its fixes can be carried over (see docs/DESIGN.md)
exclude = ["src/tracct/bpf_wrapper.py"]
