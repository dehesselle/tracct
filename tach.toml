## Tach configuration: see https://docs.gauge.sh/usage/configuration
## Module layering for picosnitch. Run `tach check` to enforce.
## Dependencies are populated by `tach sync`.

exclude = [
    "**/__pycache__",
    "**/*__pycache__",
    "**/tests",
    "**/docs",
    "**/build",
    "**/dist",
    ".venv",
]
source_roots = ["src"]
exact = true
forbid_circular_dependencies = true

[[modules]]
path = "picosnitch"
depends_on = []

[[modules]]
path = "picosnitch.constants"
depends_on = ["picosnitch"]

[[modules]]
path = "picosnitch.types"
depends_on = []

[[modules]]
path = "picosnitch.bpf_wrapper"
depends_on = []

[[modules]]
path = "picosnitch.config"
depends_on = ["picosnitch.constants"]

[[modules]]
path = "picosnitch.utils"
depends_on = []

[[modules]]
path = "picosnitch.live_feed"
depends_on = ["picosnitch.constants"]

[[modules]]
path = "picosnitch.query"
depends_on = []

[[modules]]
path = "picosnitch.query_server"
depends_on = ["picosnitch.constants", "picosnitch.query", "picosnitch.utils"]

[[modules]]
path = "picosnitch.monitor"
depends_on = ["picosnitch.bpf_wrapper", "picosnitch.config", "picosnitch.constants", "picosnitch.types", "picosnitch.utils"]

[[modules]]
path = "picosnitch.reverse_dns"
depends_on = []

[[modules]]
path = "picosnitch.rtnetlink"
depends_on = []

[[modules]]
path = "picosnitch.netinfo"
depends_on = ["picosnitch.rtnetlink"]

[[modules]]
path = "picosnitch.conntrack"
depends_on = ["picosnitch.netinfo"]

[[modules]]
path = "picosnitch.writer"
depends_on = ["picosnitch.config", "picosnitch.conntrack", "picosnitch.constants", "picosnitch.netinfo", "picosnitch.reverse_dns", "picosnitch.types", "picosnitch.utils"]

[[modules]]
path = "picosnitch.main_loop"
depends_on = ["picosnitch.config", "picosnitch.live_feed", "picosnitch.monitor", "picosnitch.types", "picosnitch.utils", "picosnitch.writer"]

[[modules]]
path = "picosnitch.cli"
depends_on = ["picosnitch.utils", "picosnitch.config", "picosnitch.constants", "picosnitch.bpf_wrapper", "picosnitch.main_loop", "picosnitch.query_server", "picosnitch.viewer"]

[[modules]]
path = "picosnitch.__main__"
depends_on = ["picosnitch.cli"]

[[modules]]
path = "picosnitch.viewer"
depends_on = ["picosnitch.live_feed", "picosnitch.query", "picosnitch.utils"]
