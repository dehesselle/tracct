# The base configuration from `tracct install`, which `tracct install -f` replaces: put
# your own settings in a drop-in such as config.d/50-local.toml, which is read after this
# file and wins per option. Every option is listed here at its default, with what it
# does. Restart the unit after a change.

# The SQLite database and how long it keeps what.
[database]
# Record to SQLite; false leaves only the live feed.
enabled = true
# Keep the rows of every write window this long; 0 keeps them forever. Fractions of a
# day are allowed.
raw_retention_days = 30
# Keep the rollups this long; 0 keeps them forever.
rollup_retention_days = 365
# The rows of each period are summed into rollups once it has closed (1 to 1440).
rollup_period_minutes = 60
# Length of a write window: traffic is summed per connection and window.
write_limit_seconds = 10
# How often rollups and purges run, besides at startup.
maintenance_interval_minutes = 60

# What is recorded of each connection, and which connections are not.
[record]
# Store remote addresses and domains.
addresses = true
# Name addresses no program looked up by a PTR query (needs addresses).
reverse_dns = true
# Store the command lines of the process and its parent.
commands = true
# Store local and remote ports.
ports = true
# Connections with a matching local or remote port are not stored, e.g. [22].
ignore_ports = []
# Domain prefixes in reversed notation: "com.example." matches all its subdomains.
ignore_domains = []
# Addresses or networks, e.g. "10.0.0.0/8", matched against both ends.
ignore_ips = []
# Rules that record some processes differently, see below; the first that matches
# applies.
process = []

# A rule as a drop-in would add it, here for a BitTorrent client whose many peers would
# each be a row of their own:
# [[record.process]]
# Patterns as in a shell ("*" for anything); a process must match every one given.
# exe = "/usr/bin/transmission-daemon"
# name = "transmission-*"
# unit = "transmission-daemon.service"
# The options above for these processes; those left out stay as above.
# addresses = false
# ports = false
# commands = false

# The level of each message the running daemon logs, by the ID that starts its line:
# "debug", "info", "warning", "error", or "off" to leave it out. A drop-in can set a
# single one; the others keep theirs.
[log]
# The kernel lacks what BPF needs; the daemon stops.
bpf-requirements-failed = "error"
# The BPF program did not load; the daemon stops.
bpf-init-failed = "error"
# The send and receive hooks did not attach; the daemon stops.
bpf-attach-failed = "error"
# An optional hook has no kernel symbol; the traffic it names goes uncounted.
hook-skipped = "warning"
# An optional hook failed to attach; the traffic it names goes uncounted.
hook-failed = "error"
# No getaddrinfo uprobe: domains come from reverse DNS only.
dns-uprobe-missing = "warning"
# Reading a connection map failed in one drain.
drain-failed = "error"
# One connection of a drain could not be handled.
drain-entry-failed = "error"
# The reader loop hit an unexpected error and carries on.
monitor-failed = "error"
# A connection map nearly filled up, so connections may have been evicted.
map-near-capacity = "warning"
# Exec events were dropped, losing their process attribution.
exec-ring-full = "warning"
# DNS events were dropped; their domains come from reverse DNS.
dns-ring-full = "warning"
# A hardlinked multi-call binary (uutils coreutils), once each.
multi-call-inode = "warning"
# The writer fell behind the reader and the oldest events were dropped.
writer-queue-full = "warning"
# The live feed fell behind; nothing recorded is lost.
live-feed-queue-full = "warning"
# A viewer fell too far behind and was disconnected.
live-feed-subscribers-dropped = "warning"
# A thread died; the daemon exits for systemd to restart it.
thread-died = "error"
# The BPF program is attached again after a suspend.
resumed-from-suspend = "info"
# events.sock could not be given to [viewer] group.
live-feed-group = "warning"
# A database write failed; it is retried with the next window.
sqlite-retry = "warning"
# Writes failed for so long that the oldest pending rows were dropped.
retry-buffer-full = "warning"
# The writer loop hit an unexpected error and carries on.
writer-failed = "error"
# The database is corrupt; it is set aside and the daemon restarts on a new one.
database-unusable = "error"
# The clock is ahead of the newest row, so retention purged nothing.
retention-skipped = "error"
# A maintenance pass that rolled up or deleted something.
maintenance-done = "info"
# Maintenance skipped a pass because the clock jumped.
maintenance-clock-jump = "warning"
# The clock went back, so periods are rolled up again.
clock-went-back = "warning"
# A namespace's conntrack table cannot be read; its forwarded traffic goes unrecorded.
conntrack-unreadable = "warning"
# A namespace's forwarded flows carry no counters (nf_conntrack_acct is off).
conntrack-no-counters = "warning"
# The kernel dropped ended-flow events; those flows miss their last bytes.
conntrack-events-lost = "warning"
# A namespace's ended-flow listener stopped until the daemon restarts.
conntrack-listener-stopped = "warning"
# A network namespace cannot be joined; its interfaces go unrecorded.
netns-unreadable = "warning"

# What the kernel side captures, and the sizes of its buffers.
[monitoring]
# Also store every executed program as a row without traffic (ports -1).
every_exe = false
# Count AF_PACKET and AF_XDP mmap-ring receives; adds a per-frame softirq hook.
mmap_ring_rx = false
# Size of the exec event ring buffer in pages, a power of two up to 16384.
exec_ring_buffer_pages = 256
# Connections the kernel can hold between drains, up to 1048576.
conn_map_max_entries = 65536
# Mask for device numbers in inode checks; auto-detected when unset (0 on btrfs).
# st_dev_mask = 0
# Record forwarded traffic of every network namespace from connection tracking
# (needs nf_conntrack_acct = 1).
conntrack = true

# Access to the live feed of `tracct view`.
[viewer]
# Group that gets events.sock; empty keeps the daemon's own. This is the group from
# tracct.sysusers, which tracct.service runs in.
group = "tracct-viewer"
